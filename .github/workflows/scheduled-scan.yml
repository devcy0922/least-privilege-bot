name: Scheduled Least Privilege Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * 1' # Monday 10:17 KST, evaluated in UTC
permissions:
  contents: read
concurrency:
  group: least-privilege-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -e . --no-deps
      - name: Audit local workflows
        run: python -m least_privilege_bot scan --path . --output-dir reports
      - name: Add job summary
        run: cat reports/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: least-privilege-report
          path: reports/
          retention-days: 30
  publish:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: least-privilege-report
          path: reports/
      - run: python -m pip install -r requirements.txt -e . --no-deps
      - name: Sync a single high-severity issue (if necessary)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m least_privilege_bot publish-issue --repo "$GITHUB_REPOSITORY" --report reports/report.json --min-severity high
