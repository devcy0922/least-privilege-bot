# Example only. Place in a PRIVATE, tightly controlled repository as
# .github/workflows/credential-inventory.yml. Do not use this in a public repo.
name: Private enterprise credential audit
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * 1' # Monday UTC; export quotas apply
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -e . --no-deps
      - name: Analyze enterprise credential inventory
        env:
          LPBOT_ENTERPRISE_TOKEN: ${{ secrets.LPBOT_ENTERPRISE_TOKEN }}
          ENTERPRISE_SLUG: ${{ vars.ENTERPRISE_SLUG }}
        run: python -m least_privilege_bot inventory --enterprise "$ENTERPRISE_SLUG" --output-dir reports
      # Restricted artifact access is still required even for a private repo.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: credential-inventory-audit
          path: reports/inventory.*
          retention-days: 3
