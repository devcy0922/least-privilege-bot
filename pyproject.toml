[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "least-privilege-bot"
version = "0.1.0"
description = "Evidence-aware GitHub Actions token permission auditor"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
lpbot = "least_privilege_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
